<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개인정보 보호법 Q&amp;A</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --card:#fff; --accent:#1d4ed8; --warn:#b45309; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --card:#292524; --accent:#93c5fd; --warn:#fbbf24; --bad:#fca5a5; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; min-height: 64px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; resize: vertical; }
  button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
  .answer { white-space: pre-wrap; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 10px; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); font-size: .8rem; margin-right: 4px; }
  .warn { color: var(--warn); } .bad { color: var(--bad); }
  details { border-top: 1px solid var(--line); padding: 8px 0; }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; }
  .body { white-space: pre-wrap; font-size: .9rem; margin: 8px 0 0; }
  .disclaimer { color: var(--muted); font-size: .8rem; margin-top: 12px; }
  .examples button { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 2px 10px; margin: 8px 6px 0 0; font-weight: 400; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>개인정보 보호법 Q&amp;A</h1>
  <p class="sub">법률 제21445호(2026. 9. 11. 시행) 조문을 검색해 근거와 함께 답합니다.</p>
  <form id="f">
    <textarea id="q" maxlength="500" placeholder="예) 홈페이지 회원가입 때 주민등록번호를 받아도 되나요?" required></textarea>
    <button id="b" type="submit">질문</button>
  </form>
  <div class="examples" id="ex"></div>
  <div id="out"></div>
</main>
<script>
const EX = ["14살 아이가 앱에 가입하려면 보호자 동의가 필요한가요?", "고객 정보가 유출되면 무엇을 해야 하나요?", "이미 수집한 개인정보를 인공지능 개발에 써도 되나요?"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
EX.forEach((t) => { const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.onclick = () => { $("q").value = t; }; $("ex").appendChild(b); });

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("b").disabled = true;
  $("out").innerHTML = '<div class="card meta">조문을 찾고 답을 쓰는 중입니다…</div>';
  try {
    const r = await fetch("ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    render(await r.json());
  } catch (err) {
    $("out").innerHTML = `<div class="card bad">요청 실패: ${esc(err.message)}</div>`;
  } finally {
    $("b").disabled = false;
  }
});

function render(a) {
  const cites = a.citations.map((c) => `<span class="tag ${c.status === "unsupported" ? "bad" : ""}">${esc(c.key)}${c.status === "unsupported" ? " (근거 없음)" : ""}</span>`).join("");
  const verify = a.citations_verified ? "" : '<div class="meta bad">⚠ 검색된 조문에 없는 조문을 인용했습니다. 근거 조문을 직접 확인하세요.</div>';
  const docs = a.retrieved.map((h, i) => `
    <details><summary>${i + 1}. ${esc(h.header)} <span class="meta">p.${h.page} · ${h.source === "article" ? "조문 번호 일치" : "유사도 " + h.score.toFixed(3)}</span>
      ${h.status === "시행예정" ? `<span class="tag warn">${esc(h.effective_from)} 시행 예정</span>` : ""}</summary>
      <div class="body">${esc(h.body)}</div></details>`).join("");
  $("out").innerHTML = `
    <div class="card"><div class="answer">${esc(a.answer)}</div>
      <div class="meta">${a.refused ? "" : "인용: " + (cites || "없음")}</div>${verify}
      <div class="meta">색인 ${esc(a.index_version)} · 검색 ${a.timings.retrieve_s}s · 생성 ${a.timings.generate_s}s${a.skipped_llm ? " (관련 조문 없음 — LLM 생략)" : ""}</div>
      <div class="disclaimer">${esc(a.disclaimer)}</div></div>
    <div class="card"><strong>근거 조문</strong>${docs || '<div class="meta">없음</div>'}</div>`;
}
</script>
</body>
</html>
